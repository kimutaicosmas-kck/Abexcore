services:
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-filter_erp}
      MYSQL_USER: ${MYSQL_USER:-erp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-erp_password}
      TZ: ${TZ:-Africa/Nairobi}
    # Bound to localhost only — never expose MySQL publicly
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --innodb-buffer-pool-size=128M
      - --thread-cache-size=16

  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: erp-backend
    restart: unless-stopped
    # Not published publicly — Nginx proxies /api and /uploads
    expose:
      - '3001'
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-erp_user}:${MYSQL_PASSWORD:-erp_password}@mysql:3306/${MYSQL_DATABASE:-filter_erp}?connection_limit=10&pool_timeout=20&connect_timeout=10
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-4}
      DB_POOL_CONNECTION_LIMIT: ${DB_POOL_CONNECTION_LIMIT:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-20}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-10}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10000}
      RATE_LIMIT_ANON_MAX: ${RATE_LIMIT_ANON_MAX:-3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-dev-encryption-key-change-in-production-32b}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      TZ: ${TZ:-Africa/Nairobi}
      USE_DB_PUSH: ${USE_DB_PUSH:-true}
      FRONTEND_URL: ${FRONTEND_URL:-${PUBLIC_URL:-http://localhost}}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-AbexCore ERP <noreply@abexcore.co.ke>}
      MPESA_ENV: ${MPESA_ENV:-stub}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_PRODUCTION: ${SEED_PRODUCTION:-true}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      PLATFORM_COMPANY_SLUG: ${PLATFORM_COMPANY_SLUG:-owner}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: erp-frontend
    restart: unless-stopped
    # Default publishes :80. Production (Caddy) sets FRONTEND_HOST_BIND=127.0.0.1:8080
    ports:
      - '${FRONTEND_HOST_BIND:-80}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  uploads:
  reports: