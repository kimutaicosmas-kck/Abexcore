# Scheduled MySQL backup for ABEXCORE ERP (GitHub Actions)
name: Scheduled Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client gzip

      - name: Run backup when DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_DIR: ./backups/scheduled
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set repository secret BACKUP_DATABASE_URL to enable automated backups."
            echo "See COMPLIANCE.md section 4 and scripts/backup-mysql.sh"
            exit 0
          fi
          bash scripts/backup-mysql.sh

      - name: Upload backup artifact
        if: env.DATABASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: mysql-backup-${{ github.run_id }}
          path: backups/scheduled/*.sql.gz
          retention-days: 14
