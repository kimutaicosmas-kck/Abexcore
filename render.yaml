# Render blueprint — free-tier friendly (2-week testing)
# MySQL: add a Railway MySQL service and paste DATABASE_URL into erp-api below.
# Docs: see DEPLOYMENT.md § Free 2-week testing

services:
  - type: web
    name: erp-api
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: TZ
        value: Africa/Nairobi
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: SEED_ON_START
        value: "false"
      - key: SEED_PRODUCTION
        value: "true"
      - key: USE_DB_PUSH
        value: "false"
      - key: MPESA_ENV
        value: stub
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: erp-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
