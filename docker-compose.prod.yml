# Production overlay: Caddy terminates TLS for abexcore.co.ke
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env up -d --build
services:
  backend:
    environment:
      # Fresh MySQL has no baseline migrations — always push schema in prod
      USE_DB_PUSH: "true"
      # 0 = off (unblocks shared-office NAT lockouts). Set to 100 later to re-enable per-email throttle.
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-0}

  caddy:
    image: caddy:2-alpine
    container_name: erp-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
